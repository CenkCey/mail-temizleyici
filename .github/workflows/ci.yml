name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MailTemizleyici.sln

      - name: Build
        run: dotnet build MailTemizleyici.sln --no-restore -c Release

      - name: Test
        run: dotnet test MailTemizleyici.sln --no-build -c Release --verbosity normal

      - name: Check for known vulnerable packages
        shell: bash
        run: |
          dotnet list MailTemizleyici.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi
